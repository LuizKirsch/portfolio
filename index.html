<html lang="pt-BR">

    <!-- Open Graph (LinkedIn, WhatsApp, Slack) e Twitter/X: o canvas não é lido por eles. -->
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="pt_BR" />
    <meta property="og:site_name" content="Luiz Kirsch" />
    <meta property="og:title" content="Luiz Kirsch · Desenvolvedor Fullstack" />

      property="og:description"
      content="Desenvolvedor Fullstack Pleno na Fraga & Bitello. PHP, Laravel e React. Portfólio desenhado como um diagrama de system design."

    <meta property="og:url" content="%SITE_URL%/" />

    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />

      property="og:image:alt"
      content="Quadro de system design: um visitante faz GET /luiz para o gateway, que se liga aos serviços sobre, projetos, experiência e contato."

    <meta name="twitter:card" content="summary_large_image" />

    <!-- Tema aplicado antes do React para não piscar branco no modo escuro. -->
    <script>
      document.documentElement.dataset.theme =
        localStorage.getItem('theme') ||
        (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
    </script>
